<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>硝子牌麻雀</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a square felt table. Each seat (hand + river + score chip) is laid out as if it sat at the bottom, then the whole seat layer is rotated to its side; the centre box holds round, wall and dora. Your own hand sits under the table at full size. Single deliberate dark look. */
:root{
  --table:#0E1922; --table-hi:#16293A; --line:rgba(205,167,94,.22); --panel:rgba(255,255,255,.025);
  --text:#ECE6D6; --muted:#93A3AF; --brass:#CDA75E; --brass-hi:#E6C27A;
  --blood:#7C1F29; --blood-dk:#4A1118;
  --ivory-dk:#C8BC9C; --ink:#1B2529; --t-red:#B32A31; --t-green:#1D7047; --t-blue:#244F8E;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
  --felt:#123444; --felt-dk:#0B2230;
  --tw:clamp(20px, calc((min(100vw, 860px) - 44px) / 15), 48px);
  --T:max(300px, min(calc(100vw - 32px), calc(100vh - 290px), 860px));
  --C:calc(var(--T)*.35); --rw:calc(var(--T)*.052); --ow:calc(var(--T)*.05);
  color-scheme:dark;
}
@supports (height:100dvh){ :root{ --T:max(300px, min(calc(100vw - 32px), calc(100dvh - 290px), 860px)); } }
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0; background:radial-gradient(120% 80% at 50% 45%, var(--table-hi), var(--table) 70%) fixed; background-color:var(--table); color:var(--text); font-family:var(--f-body); font-size:14px; overflow-x:hidden}
#app{max-width:900px; margin:0 auto; display:flex; flex-direction:column; gap:8px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:8px; box-sizing:border-box}

/* table */
.table{position:relative; width:var(--T); height:var(--T); margin:0 auto; flex:none; border-radius:calc(var(--T)*.035); background:radial-gradient(circle at 50% 50%, var(--felt) 0%, var(--felt-dk) 85%); box-shadow:inset 0 0 0 calc(var(--T)*.012) #2A1C12, inset 0 0 0 calc(var(--T)*.016) rgba(205,167,94,.35), inset 0 0 calc(var(--T)*.08) rgba(0,0,0,.55), 0 14px 40px rgba(0,0,0,.5)}
.cbox{position:absolute; left:50%; top:50%; width:var(--C); height:var(--C); transform:translate(-50%,-50%); border-radius:calc(var(--T)*.02); background:rgba(4,12,18,.7); box-shadow:inset 0 0 0 1px rgba(205,167,94,.3)}
.cmid{position:absolute; inset:22%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(var(--T)*.006); text-align:center; font-size:calc(var(--T)*.03); color:var(--muted); line-height:1.2}
.cmid .rnd{font-family:var(--f-display); font-weight:800; font-size:calc(var(--T)*.042); color:var(--brass-hi); letter-spacing:.06em; white-space:nowrap}
.cmid b{font-family:var(--f-num); font-weight:500; color:var(--text)}
.cmid .dora{display:flex; gap:1px}
.cmid .dora .tile{--w:calc(var(--T)*.04)}
.frame{position:absolute; inset:0; pointer-events:none}
.f1{transform:rotate(-90deg)} .f2{transform:rotate(180deg)} .f3{transform:rotate(90deg)}
.frame .river{position:absolute; left:calc(50% - var(--C)/2); top:calc(50% + var(--C)/2 + var(--T)*.008); display:flex; flex-direction:column; gap:calc(var(--T)*.003)}
.rrow{display:flex; gap:1px; align-items:flex-end; min-height:calc(var(--rw)*1.36)}
.frame .river .tile{--w:var(--rw)}
.ohand{position:absolute; bottom:calc(var(--T)*.022); left:50%; transform:translateX(-50%); display:flex; align-items:flex-end; gap:1px; white-space:nowrap}
.ohand .tile{--w:var(--ow)}
.ohand .gap{width:calc(var(--ow)*.3); flex:none}
.ohand .melds{margin-left:calc(var(--ow)*.5); gap:calc(var(--ow)*.2)}
.ohand .melds .tile{--w:calc(var(--ow)*.9)}
.seatchip{position:absolute; left:50%; top:calc(50% + var(--C)/2 - var(--T)*.052); transform:translateX(-50%); display:flex; align-items:center; gap:calc(var(--T)*.01); white-space:nowrap; font-size:calc(var(--T)*.028); padding:calc(var(--T)*.004) calc(var(--T)*.014); border-radius:999px; color:var(--text)}
.seatchip .w{font-family:var(--f-display); font-weight:800; color:var(--brass)}
.seatchip .w.dealer{background:var(--brass); color:var(--table); border-radius:3px; padding:0 3px}
.seatchip .sc{font-family:var(--f-num); font-variant-numeric:tabular-nums}
.seatchip .nm{color:var(--muted)}
.seatchip.turn{background:rgba(205,167,94,.22); box-shadow:inset 0 0 0 1px var(--brass)}
.stick{position:absolute; left:50%; top:calc(50% + var(--C)/2 - var(--T)*.075); width:calc(var(--C)*.5); height:calc(var(--T)*.012); transform:translateX(-50%); border-radius:99px; background:#F2EEE2; box-shadow:0 1px 2px rgba(0,0,0,.5)}
.stick::after{content:""; position:absolute; left:50%; top:50%; width:calc(var(--T)*.009); height:calc(var(--T)*.009); transform:translate(-50%,-50%); border-radius:50%; background:var(--t-red)}
button{font-family:inherit; color:inherit}
:focus-visible{outline:2px solid var(--brass-hi); outline-offset:2px}

.bar{grid-area:hdr; display:flex; align-items:center; gap:8px 14px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:8px}
.brand{font-family:var(--f-display); font-weight:800; font-size:18px; letter-spacing:.12em; color:var(--brass)}
.chip{display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:12px}
.chip b{color:var(--text); font-family:var(--f-num); font-weight:500; font-variant-numeric:tabular-nums}
.chip .tile{--w:calc(var(--tw)*.58)}
.bar .spacer{flex:1}
.ghost{background:none; border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-size:12px; color:var(--muted); cursor:pointer}
.ghost:hover{color:var(--text); border-color:var(--brass)}
.ghost[aria-pressed="true"]{color:var(--table); background:var(--brass); border-color:var(--brass)}

.seat{display:flex; flex-direction:column; gap:5px; min-width:0}
.opp{background:var(--panel); border:1px solid rgba(205,167,94,.1); border-radius:10px; padding:6px 10px 8px}
.opp.turn, .me.turn{border-color:rgba(230,194,122,.55)}
#o1{grid-area:o1} #o2{grid-area:o2} #o3{grid-area:o3}
.who{display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-height:22px}
.who .name{font-family:var(--f-display); font-weight:800; font-size:14px; letter-spacing:.06em}
.who .pos{font-size:11px; color:var(--muted)}
.wind{font-family:var(--f-display); font-size:12px; border:1px solid var(--brass); color:var(--brass); border-radius:4px; padding:0 5px}
.wind.dealer{background:var(--brass); color:var(--table)}
.score{font-family:var(--f-num); font-variant-numeric:tabular-nums; font-size:14px}
.flag{font-size:11px; letter-spacing:.1em; padding:1px 8px; border-radius:999px; background:var(--blood); color:#FBE3DF}
.flag.furi{background:#3A4752; color:var(--text)}
.status{color:var(--muted); font-size:12px; margin-left:auto}
.status b{color:var(--brass-hi); font-weight:700}
.status i{font-style:normal; color:#E5847C}

.hand{display:flex; align-items:flex-end; gap:2px; flex-wrap:nowrap}
.opp .hand{--w:var(--ow); min-height:calc(var(--ow)*1.36 + 4px)}
.opp .hand .tile{--w:var(--ow)}
.me .hand{min-height:calc(var(--tw)*1.36 + 12px); padding-top:10px}
.hand .gap{width:calc(var(--tw)*.3); flex:none}
.melds{display:flex; gap:6px; margin-left:auto; align-items:flex-end; flex:none}
.meld{display:flex; gap:1px; align-items:flex-end}
.me .melds .tile{--w:calc(var(--tw)*.82)}
.river{display:flex; flex-wrap:wrap; gap:2px; align-content:flex-start}
.opp .river{min-height:calc(var(--rw)*1.36)}
.opp .river .tile{--w:var(--rw)}
.me .river{min-height:calc(var(--mrw)*1.36*2 + 4px)}
.me .river .tile{--w:var(--mrw)}
.me{grid-area:me}

.center{grid-area:ctr; display:flex; align-items:center; justify-content:center; min-height:34px; border-block:1px solid var(--line); padding-block:6px; text-align:center}
#msg{font-size:13px; text-wrap:balance}
#msg em{font-style:normal; color:var(--brass-hi); font-weight:700}

.actions{display:flex; gap:8px; flex-wrap:wrap; min-height:42px; align-items:center}
.btn{border:1px solid var(--brass); background:none; color:var(--brass-hi); border-radius:8px; padding:8px 18px; font-size:15px; font-weight:700; letter-spacing:.08em; cursor:pointer; font-family:var(--f-display); display:inline-flex; align-items:center; gap:6px}
.btn:hover{background:rgba(205,167,94,.12)}
.btn.primary{background:var(--brass); color:#1A1306}
.btn.primary:hover{background:var(--brass-hi)}
.btn.red{background:var(--blood); border-color:#B4434E; color:#FFE8E4}
.btn .tile{--w:calc(var(--tw)*.55)}
.hint{color:var(--muted); font-size:12px}

/* tiles */
.tile{--w:var(--tw); width:var(--w); height:calc(var(--w)*1.36); border-radius:calc(var(--w)*.14); position:relative; flex:none; padding:0; border:0; display:block; transition:transform .12s ease}
.tile svg{width:100%; height:100%; display:block; position:relative; z-index:1}
.tile.solid{background:linear-gradient(#FFFBF0,#ECE3CB); box-shadow:0 calc(var(--w)*.08) 0 var(--ivory-dk), 0 calc(var(--w)*.12) calc(var(--w)*.2) rgba(0,0,0,.5)}
.tile.glass{background:linear-gradient(160deg, rgba(232,250,255,.82), rgba(160,208,224,.52) 55%, rgba(206,238,248,.7)); box-shadow:inset 0 0 0 1px rgba(255,255,255,.75), inset 0 0 calc(var(--w)*.25) rgba(255,255,255,.4), 0 calc(var(--w)*.08) 0 rgba(110,170,192,.6), 0 calc(var(--w)*.12) calc(var(--w)*.22) rgba(0,0,0,.4)}
.tile.glass::after{content:""; position:absolute; inset:0; border-radius:inherit; background:linear-gradient(118deg, transparent 30%, rgba(255,255,255,.38) 36%, transparent 42%, transparent 64%, rgba(255,255,255,.18) 67%, transparent 70%); z-index:2; pointer-events:none}
.tile.back{background:linear-gradient(#93303A,var(--blood) 45%,var(--blood-dk)); box-shadow:inset 0 0 0 calc(var(--w)*.06) rgba(255,215,200,.14), 0 calc(var(--w)*.08) 0 #340A10, 0 calc(var(--w)*.12) calc(var(--w)*.2) rgba(0,0,0,.5)}
.tile.back::after{content:""; position:absolute; inset:22% 26%; border:1px solid rgba(255,215,200,.22); border-radius:50%}
.hand button.tile{cursor:pointer}
.hand button.tile:disabled{cursor:default}
.hand button.tile.sel{transform:translateY(-22%)}
@media (hover:hover){ .hand button.tile.can:hover{transform:translateY(-14%)} }
.tile.dim{filter:grayscale(.6) brightness(.5)}
.tile.rec::before{content:""; position:absolute; top:calc(var(--w)*-.3); left:50%; width:5px; height:5px; margin-left:-2.5px; border-radius:50%; background:var(--brass-hi); z-index:3}
.tile.last{outline:2px solid var(--brass-hi); outline-offset:1px}
.tile.side{transform:rotate(-90deg); margin-inline:calc(var(--w)*.18)}
.tile.called{opacity:.3}
.tile.win{outline:2px solid #E5534B; outline-offset:2px}
.tm{font-family:var(--f-display); font-weight:800; fill:var(--ink)}
.tr{font-family:var(--f-display); font-weight:800; fill:var(--t-red)}
.th{font-family:var(--f-display); font-weight:800}

/* overlay */
.overlay{position:absolute; top:0; left:0; right:0; min-height:100%; display:flex; align-items:flex-start; justify-content:center; z-index:20; padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px)); box-sizing:border-box}
.overlay::before{content:""; position:fixed; inset:0; background:rgba(5,10,14,.78); z-index:-1}
.panel{background:linear-gradient(#18293A,#101D28); border:1px solid var(--line); border-radius:14px; width:min(640px,100%); margin-block:16px; padding:22px; box-sizing:border-box; display:flex; flex-direction:column; gap:14px; box-shadow:0 20px 60px rgba(0,0,0,.6)}
.panel h2{font-family:var(--f-display); font-weight:800; font-size:30px; letter-spacing:.14em; margin:0; color:var(--brass); text-wrap:balance}
.panel h2 small{font-size:14px; color:var(--muted); letter-spacing:.04em; margin-left:10px}
.panel p{margin:0; line-height:1.75; max-width:62ch}
.panel .lead{color:var(--muted)}
.rowtiles{display:flex; flex-wrap:wrap; gap:2px; align-items:flex-end}
.rowtiles .tile{--w:clamp(17px, 5.6vw, 32px)}
.rowtiles .gap{width:10px}
.yaku{display:grid; grid-template-columns:1fr auto; gap:4px 18px; font-size:14px}
.yaku span:nth-child(even){font-family:var(--f-num); color:var(--brass-hi); text-align:right}
.total{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; border-top:1px solid var(--line); padding-top:10px}
.total .big{font-family:var(--f-num); font-size:26px; color:var(--brass-hi); font-variant-numeric:tabular-nums}
.scores{display:grid; grid-template-columns:auto auto 1fr auto; gap:4px 14px; font-family:var(--f-num); font-variant-numeric:tabular-nums; align-items:baseline}
.scores .nm{font-family:var(--f-body)}
.scores .up{color:#7FC79A} .scores .down{color:#E5847C}
.rules{display:grid; gap:10px}
.rules h3{font-family:var(--f-display); font-size:16px; margin:6px 0 0; color:var(--brass)}
.rules ul{margin:0; padding-left:1.2em; line-height:1.75}
.legend{display:flex; gap:16px; flex-wrap:wrap; align-items:center; color:var(--muted); font-size:12px}
.legend span{display:inline-flex; gap:6px; align-items:center}
.legend .tile{--w:22px}
/* network */
.netbadge{font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:2px 9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:40vw}
.netbadge.off{color:#E5847C; border-color:rgba(229,132,124,.5)}
.field{display:flex; flex-direction:column; gap:6px}
.field label{font-size:12px; color:var(--muted); letter-spacing:.06em}
.field input{background:rgba(0,0,0,.3); border:1px solid var(--line); border-radius:8px; color:var(--text); font:inherit; font-size:16px; padding:9px 12px; width:100%; box-sizing:border-box}
.field input:focus{outline:2px solid var(--brass); outline-offset:0}
.inrow{display:flex; gap:8px; align-items:stretch}
.inrow input{flex:1; min-width:0}
.tlist{display:grid; gap:6px}
.trow{display:flex; align-items:center; gap:10px; padding:8px 12px; border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,.03)}
.trow .code{font-family:var(--f-num); color:var(--brass-hi); letter-spacing:.1em}
.trow .who{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-height:0}
.seats{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
.seatc{border:1px solid var(--line); border-radius:10px; padding:10px 12px; display:flex; align-items:center; gap:10px; min-width:0}
.seatc .w{font-family:var(--f-display); font-weight:800; color:var(--brass); font-size:18px}
.seatc .n{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.seatc.cpu .n{color:var(--muted)}
.seatc.me{border-color:var(--brass)}
.bigcode{font-family:var(--f-num); font-size:28px; letter-spacing:.2em; color:var(--brass-hi)}
.err{color:#E5847C; font-size:13px; line-height:1.6}
.panel .actions{min-height:0}
@media (max-width:420px){ .brand{font-size:16px; letter-spacing:.06em} .bar{gap:6px; flex-wrap:nowrap} .ghost{padding:3px 9px; font-size:11px; white-space:nowrap} .panel{padding:16px} .panel h2{font-size:24px} .btn{padding:8px 13px} }
@media (prefers-reduced-motion:reduce){ .tile{transition:none} }
</style>

<div id="app">
  <header class="bar">
    <div class="brand">硝子牌麻雀</div>
    <span class="netbadge" id="netBadge" hidden></span>
    <span class="spacer"></span>
    <button class="ghost" id="viewBtn" aria-pressed="false" title="他家から見えている自分の手牌">他家視点</button>
    <button class="ghost" id="assistBtn" aria-pressed="true">アシスト</button>
    <button class="ghost" id="helpBtn">ルール</button>
  </header>

  <div class="table" id="table">
    <div class="cbox"><div class="cmid">
      <span class="rnd" id="roundLabel">東1局</span>
      <span><span id="honbaLabel">0本場</span> 供託<b id="potLabel">0</b></span>
      <span>残り <b id="wallCount">0</b></span>
      <span class="dora" id="doraInd" title="ドラ表示牌"></span>
    </div></div>
    <div class="frame f0" id="f0"></div>
    <div class="frame f1" id="f1"></div>
    <div class="frame f2" id="f2"></div>
    <div class="frame f3" id="f3"></div>
  </div>

  <div class="center"><div id="msg"></div></div>

  <section class="seat me" id="me">
    <div class="hand" id="myHand"></div>
    <div class="who"><span class="flag furi" id="myFuri" hidden>フリテン</span><span class="status" id="myStatus"></span></div>
    <div class="actions" id="actions"></div>
  </section>
</div>

<div class="overlay" id="overlay" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>

<script>
/*LOGIC-START*/
const KNUM=['一','二','三','四','五','六','七','八','九'];
const HONOR=['東','南','西','北','白','發','中'];
const GREEN=[19,20,21,23,25,32];
const isHonor=k=>k>=27;
const isTerm=k=>k<27&&(k%9===0||k%9===8);
const isYao=k=>isHonor(k)||isTerm(k);
const suitOf=k=>k<27?Math.floor(k/9):3;
function tileName(k){return k<27?KNUM[k%9]+['萬','筒','索'][suitOf(k)]:HONOR[k-27];}
function doraFrom(i){if(i<27)return suitOf(i)*9+(i%9+1)%9; if(i<31)return 27+(i-27+1)%4; return 31+(i-31+1)%3;}
function makeTiles(sanma){const a=[];for(let k=0;k<34;k++){if(sanma&&k>=1&&k<=7)continue;for(let c=0;c<4;c++)a.push({id:k*4+c,k,g:c<3});}return a;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function counts(tiles){const c=new Array(34).fill(0);for(const t of tiles)c[t.k]++;return c;}

function shantenNormal(c,nm=0){
  let best=8; const cc=c.slice();
  function rec(i,m,t,p){
    while(i<34&&cc[i]===0)i++;
    if(i>=34){const s=8-2*m-Math.min(t,4-m)-p; if(s<best)best=s; return;}
    if(cc[i]>=3){cc[i]-=3;rec(i,m+1,t,p);cc[i]+=3;}
    if(i<27&&i%9<=6&&cc[i+1]&&cc[i+2]){cc[i]--;cc[i+1]--;cc[i+2]--;rec(i,m+1,t,p);cc[i]++;cc[i+1]++;cc[i+2]++;}
    if(cc[i]>=2){cc[i]-=2;if(!p)rec(i,m,t,1);if(m+t<4)rec(i,m,t+1,p);cc[i]+=2;}
    if(m+t<4){
      if(i<27&&i%9<=7&&cc[i+1]){cc[i]--;cc[i+1]--;rec(i,m,t+1,p);cc[i]++;cc[i+1]++;}
      if(i<27&&i%9<=6&&cc[i+2]){cc[i]--;cc[i+2]--;rec(i,m,t+1,p);cc[i]++;cc[i+2]++;}
    }
    const n=cc[i]; cc[i]=0; rec(i+1,m,t,p); cc[i]=n;
  }
  rec(0,nm,0,0); return best;
}
function shantenChiitoi(c){let p=0,k=0;for(const v of c){if(v>=2)p++;if(v>=1)k++;}return 6-p+Math.max(0,7-k);}
function shantenKokushi(c){let k=0,pair=0;for(let i=0;i<34;i++)if(isYao(i)&&c[i]){k++;if(c[i]>=2)pair=1;}return 13-k-pair;}
function shanten(c,nm=0){const n=shantenNormal(c,nm);return nm?n:Math.min(n,shantenChiitoi(c),shantenKokushi(c));}
function waitsOf(c,nm=0){const w=[];for(let k=0;k<34;k++){if(c[k]>=4)continue;c[k]++;if(shanten(c,nm)===-1)w.push(k);c[k]--;}return w;}

function decompose(c){
  const res=[],cc=c.slice();

/* ---------- actions (validated on the host) ---------- */
function discardAllowed(seat,id,rii){

function hostAction(seat,a,arg){

function wireTable(){
  const t=NET.tr,die=()=>{NET.conn=false;render();};
  t.presence({cid:NET.cid,nick:NET.nick}).catch(()=>{});
  t.on('st',msg=>{if(NET.mode==='guest')applyState(msg.data);},die);
  t.on('act',msg=>{
    if(NET.mode!=='host')return;
    const d=msg.data; if(!d||typeof d!=='object')return;
    const id=msg.by||(typeof d.cid==='string'?d.cid:null); if(!id)return;
    handleAct(id,d);
  },die);
  t.onPeers(ch=>{
    const set=new Set();
    for(const p of ch.peers){const c=p.by||(p.presence&&typeof p.presence.cid==='string'?p.presence.cid:null);if(c)set.add(c);}
    NET.present=set;
    if(NET.mode==='host'){
      if(ch.joined.length)broadcastNow();
      if(ch.left.length)setTimeout(()=>{if(NET.mode==='host'&&S.phase==='play'&&S.awaiting&&!isActive(S.awaiting.seat)&&!S.next)resolveAsCpu();},4000);
      advertise();
    }
    render();
  },die);
  t.onConnection(c=>{NET.conn=c;render();},()=>{});
}
function handleAct(id,d){
  const a=String(d.a||'');
  if(a==='sit'){
    if(S.phase==='lobby'&&!S.humans.includes(id)){const i=S.humans.findIndex((h,j)=>j>0&&j<NP()&&!h);if(i>0){S.humans[i]=id;S.names[i]=cleanNick(d.nick);}}
    else if(S.phase==='lobby'){S.names[S.humans.indexOf(id)]=cleanNick(d.nick);}
    render(); broadcastNow(); return;
  }
  if(a==='leave'){
    if(S.phase==='lobby'){const i=S.humans.indexOf(id);if(i>0){S.humans[i]=null;S.names[i]=null;}render();}
    return;
  }
  const seat=S.humans.indexOf(id); if(seat<0)return;
  hostAction(seat,a,d.arg);
  broadcastNow();
}
function netSend(d){
  if(!NET.tr)return;

  NET.tr.emit('act',d).catch(e=>{UI.pending=false;if(e&&e.code==='not_permitted'){NET.err='閲覧のみの権限なので観戦だけできます。対局するには、オーナーから「操作できる」以上の権限をもらってください。';}render();});

function broadcastNow(){

}

async function hostTable(resume){

async function joinTable(code){
  code=String(code||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,4);

  lsSet('glass-nick',NET.nick); lsSet('glass-guest',code);

function applyState(d){

  const seat=S.humans.indexOf(NET.cid);

  if(S.phase==='lobby'&&seat<0&&Date.now()-NET.lastSit>2500&&S.humans.some((h,i)=>i>0&&i<NP()&&!h)){NET.lastSit=Date.now();netSend({a:'sit',nick:NET.nick});}

}

  <ul><li>4人打ち東風戦4局、持ち点25,000点。ひとりならCPU3人と、友達と対局なら空席にCPUが入ります。</li><li>ポン・チー・カン（明槓・暗槓・加槓）あり。喰いタン・後付けあり、喰い替えなし。カンドラは即乗り、嶺上開花・槍槓あり。</li><li>手牌は種類順に並ぶので、伏せ牌の<b>位置</b>からも中身を推理できます。鳴くときは透明な牌から晒し、不透明牌は手の内に残ります。</li><li>CPUもあなたの硝子牌を見て、危険牌を避けたり残り枚数を数えたりします。</li></ul>
  <h3>三人打ち</h3>
  <ul><li>萬子の二〜八を抜いた108枚。チーなし。持ち点35,000点の東風戦3局。</li><li>北は<b>北抜き</b>で抜きドラに（1枚1翻、嶺上牌を補充）。リーチ中に引いた北は自動で抜きます。</li><li>ツモ損あり（ツモ和了は2人から受け取り）。ドラ表示が一萬なら九萬、九萬なら一萬がドラ。ノーテン罰符は2,000点。</li></ul>
  <h3>和了と点数</h3>
  <ul><li>通常の役・翻・符で計算。鳴くと門前役は消え、三色・一通・チャンタ・染め手は喰い下がり。</li><li>ロンには役が必要。フリテンあり。ダブロンなし（上家取り）。</li><li>流局時はノーテン罰符3,000点。親が和了か聴牌なら連荘。誰かが0点未満で終了。</li></ul>
  <h3>操作</h3>
  <ul><li>${HOVER?'牌をクリックで捨てる':'牌をタップで選び、もう一度タップで捨てる'}。鳴ける牌が出るとボタンが出ます。</li><li><b>他家視点</b>: 自分の手牌が他家からどう見えているか表示。</li><li><b>アシスト</b>: 向聴数・待ち・役なし警告・おすすめ打牌（金の点）を表示。</li></ul></div>`;
}
function tableListHTML(){
  if(!NET.api)return '<span class="hint">通信の準備中…</span>';
  if(!NET.tables.length)return '<span class="hint">今は開いている卓がありません。</span>';
  return NET.tables.map(t=>`<div class="trow"><span class="code">${esc(t.code)}</span><span class="who">${esc(t.nick)}の卓 · ${t.N===3?'三麻':'四麻'} ${t.n}/${t.N}人${t.st?' · 対局中':''}</span><button class="btn" data-o="joinT" data-code="${esc(t.code)}">${t.st?'入る':'参加'}</button></div>`).join('');
}
function updateTableList(){const e=$('tlist');if(e)e.innerHTML=tableListHTML();}
function setMode(n){
  if(NET.mode!=='host'||S.phase!=='lobby')return;
  if(n===3&&S.humans[3]){NET.err='北家の席に人がいるため三人打ちにできません。';render();return;}
  NET.err=''; S.n=n; S.scores=[0,1,2,3].map(()=>n===3?35000:25000); render(); advertise();
}
function seatsHTML(){
  return `<div class="seats">${seats().map(i=>{const h=S.humans[i];const me=h&&h===NET.cid;return `<div class="seatc ${h?'':'cpu'} ${me?'me':''}"><span class="w">${WIND_CH[i]}</span><span class="n">${h?esc(S.names[i]||'ゲスト')+(me?'（あなた）':'')+(i===0?' · ホスト':''):'CPU'}</span></div>`;}).join('')}</div>`;
}
function renderOverlay(){
  const ov=$('overlay'),pn=$('panel');
  let html='',key='';
  const err=NET.err?`<p class="err">${esc(NET.err)}</p>`:'';
  if(UI.help){html=`<h2>ルール</h2>${rulesHTML()}<div class="actions"><button class="btn primary" data-o="closeHelp">閉じる</button></div>`;}
  else if(S.phase==='title'){
    let resume='';
    try{const h=JSON.parse(lsGet('glass-host')||'null');if(h&&h.code)resume+=`<button class="btn" data-o="resumeHost">卓 ${esc(h.code)} を再開（ホスト）</button>`;}catch(e){}
    const g=lsGet('glass-guest'); if(g&&/^[a-z0-9]{4}$/.test(g))resume+=`<button class="btn" data-o="rejoin">卓 ${esc(g)} に戻る</button>`;
    const btns=`<div class="actions"><button class="btn primary" data-o="solo">ひとりで四麻</button><button class="btn primary" data-o="solo3">ひとりで三麻</button><button class="btn primary" data-o="net">友達と対局</button>${resume}</div>`;
    html=`<h2>硝子牌麻雀<small>Glass Tile Mahjong</small></h2>${btns}${rulesHTML()}${btns}`;
  }
  else if(S.phase==='netmenu'){
    key='netmenu';
    html=`<h2>友達と対局</h2>
    <p class="lead">卓を立てて友達を待つか、開いている卓に参加します。友達には先にこのアーティファクトを共有してください（「共有」メニューから、操作できる以上の権限で）。</p>
    ${err}
    <div class="field"><label for="nickIn">表示名</label><input id="nickIn" maxlength="12" autocomplete="nickname" value="${esc(NET.nick)}" placeholder="例: たろう"></div>
    <div class="actions"><button class="btn primary" data-o="host">卓を立てる</button></div>
    <div class="field"><label>開いている卓</label><div class="tlist" id="tlist">${tableListHTML()}</div></div>
    <div class="field"><label for="codeIn">卓コードで参加</label><div class="inrow"><input id="codeIn" maxlength="4" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="4文字"><button class="btn" data-o="joinCode">参加</button></div></div>
    <div class="actions"><button class="btn" data-o="back">戻る</button></div>`;
  }
  else if(S.phase==='joining'){html=`<h2>接続中…</h2><p class="lead">卓 <span class="bigcode">${esc(NET.code)}</span> に入っています。</p>${err}<div class="actions"><button class="btn" data-o="leaveNet">やめる</button></div>`;}
  else if(S.phase==='closed'){html=`<h2>卓が閉じられました</h2><p class="lead">ホストが卓を閉じました。</p><div class="actions"><button class="btn primary" data-o="leaveNet">タイトルへ</button></div>`;}
  else if(S.phase==='lobby'){
    const host=NET.mode==='host',seated=S.humans.includes(NET.cid);
    html=`<h2>卓<small>コード</small> <span class="bigcode">${esc(NET.code)}</span></h2>
    <p class="lead">${host?'友達に卓コードを伝えるか、「友達と対局」の一覧から参加してもらってください。空いた席にはCPUが入ります。':seated?'ホストが対局を始めるのを待っています。':'満席のため観戦になります。'}</p>
    ${host?`<div class="actions"><button class="ghost" data-o="mode4" aria-pressed="${NP()===4}">四人打ち</button><button class="ghost" data-o="mode3" aria-pressed="${NP()===3}">三人打ち</button></div>`:`<p class="lead">${NP()===3?'三人打ち':'四人打ち'}</p>`}${seatsHTML()}${err}
    <div class="actions">${host?'<button class="btn primary" data-o="startNet">対局開始</button><button class="btn" data-o="leaveNet">卓を閉じる</button>':'<button class="btn" data-o="leaveNet">退出</button>'}</div>`;
  }
  else if(S.phase==='result'&&S.result){
    const r=S.result;
    if(r.type==='win'&&r.res){
      const res=r.res,p=clampSeat(r.p);
      html=`<h2>${r.tsumo?'ツモ':'ロン'}<small>${esc(label(p))}の和了${p===S.dealer?'（親）':''}${r.tsumo?'':' ← '+esc(label(clampSeat(r.from)))}</small></h2>
      ${handRow(p,r.winId)}
      <div class="legend"><span>ドラ表示 ${S.doraInd.map(t=>tileEl(t)).join('')}</span>${S.riichi[p]&&S.uraInd.length?`<span>裏ドラ表示 ${S.uraInd.slice(0,S.doraInd.length).map(t=>tileEl(t)).join('')}</span>`:''}</div>
      <div class="yaku">${(Array.isArray(res.yaku)?res.yaku:[]).map(y=>`<span>${esc(y[0])}</span><span>${typeof y[1]==='number'?y[1]+'翻':esc(y[1])}</span>`).join('')}</div>
      <div class="total"><span class="big">${fmt(r.total)}</span><span>${res.yakuman?esc(res.label):`${num(res.han)}翻 ${num(res.fu)}符${res.label?' '+esc(res.label):''}`}</span>${num(r.honba)?`<span class="hint">${num(r.honba)}本場込み</span>`:''}${num(r.pot)?`<span class="hint">供託 +${fmt(r.pot)}</span>`:''}</div>
      ${scoreTable(r)}`;
    }else{
      const ten=Array.isArray(r.ten)?r.ten:[];
      html=`<h2>流局<small>${seats().map(p=>`${esc(label(p))} ${ten[p]?'聴牌':'ノーテン'}`).join(' / ')}</small></h2>${scoreTable(r)}`;
    }
    const end=seats().some(p=>S.scores[p]<0)||(!r.renchan&&S.handNo>=NP());
    html+=NET.mode==='guest'?'<p class="lead">ホストが次へ進めるのを待っています。</p>':`<div class="actions"><button class="btn primary" data-o="next">${end?'最終結果へ':'次の局へ'}</button></div>`;
  }else if(S.phase==='over'){
    const order=seats().sort((a,b)=>S.scores[b]-S.scores[a]);
    const rank=order.indexOf(ME)+1;
    const btns=NET.mode==='solo'?'<button class="btn primary" data-o="'+(NP()===3?'solo3':'solo')+'">もう一度</button><button class="btn" data-o="back">タイトルへ</button>'
      :NET.mode==='host'?'<button class="btn primary" data-o="again">同じ卓でもう一度</button><button class="btn" data-o="leaveNet">卓を閉じる</button>'
      :'<p class="lead">ホストが次の対局を始めるのを待っています。</p><button class="btn" data-o="leaveNet">退出</button>';
    html=`<h2>${SPECT?'終局':rank+'位'}<small>東風戦 終了</small></h2>
    <div class="scores">${order.map((p,i)=>`<span>${i+1}位</span><span class="nm">${esc(label(p))}</span><span></span><span>${fmt(S.scores[p])}</span>`).join('')}</div>
    <div class="actions">${btns}</div>`;
  }
  const wasHidden=ov.hidden;
  ov.hidden=!html;
  if(!html){pn.dataset.view='';return;}
  if(key&&pn.dataset.view===key){updateTableList();return;}
  const view=key||S.phase+(UI.help?'-help':'');
  const changed=pn.dataset.shown!==view; pn.dataset.shown=view;
  pn.dataset.view=key; pn.innerHTML=html;
  if(wasHidden||changed)window.scrollTo(0,0);
}

/* ---------- events ---------- */
$('myHand').addEventListener('click',e=>{const b=e.target.closest('button.tile');if(b)onTile(+b.dataset.id);});
$('actions').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)onAction(b.dataset.a,b.dataset.arg);});
$('panel').addEventListener('input',e=>{if(e.target.id==='nickIn'){NET.nick=cleanNick(e.target.value,'');lsSet('glass-nick',NET.nick);}});
$('panel').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='codeIn')joinTable(e.target.value);});
$('panel').addEventListener('click',e=>{
  const b=e.target.closest('[data-o]'); if(!b)return;
  const o=b.dataset.o;
  if(o==='closeHelp'){UI.help=false;render();}
  else if(o==='solo'){UI.help=false;newSolo(4);}
  else if(o==='solo3'){UI.help=false;newSolo(3);}
  else if(o==='mode3'||o==='mode4'){setMode(o==='mode3'?3:4);}
  else if(o==='net'){NET.err='';S=blankState('netmenu');render();netReady().then(()=>{if(S.phase==='netmenu'){const ni=$('nickIn');if(ni&&!ni.value&&NET.nick)ni.value=NET.nick;updateTableList();}});}
  else if(o==='back'){NET.err='';S=blankState('title');render();}
  else if(o==='host'){if(!NET.nick){NET.err='表示名を入力してください。';$('panel').dataset.view='';render();return;}hostTable(false);}
  else if(o==='joinCode'){if(!NET.nick){NET.err='表示名を入力してください。';$('panel').dataset.view='';render();return;}joinTable(($('codeIn')||{}).value);}
  else if(o==='joinT'){if(!NET.nick){NET.err='表示名を入力してください。';$('panel').dataset.view='';render();return;}joinTable(b.dataset.code);}
  else if(o==='resumeHost'){hostTable(true);}
  else if(o==='rejoin'){netReady().then(()=>joinTable(lsGet('glass-guest')));}
  else if(o==='leaveNet')leaveNet();
  else if(o==='startNet')startNet();
  else if(o==='again')againNet();
  else if(o==='next'){if(NET.mode!=='guest')nextHand();}
});
$('helpBtn').onclick=()=>{UI.help=true;render();};
$('viewBtn').onclick=()=>{UI.view=!UI.view;render();};
$('assistBtn').onclick=()=>{UI.assist=!UI.assist;saveUI();render();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.help){UI.help=false;render();}});

function start(data){
  if(data&&data.S&&data.S.melds&&data.S.phase!=='title'){S=data.S;render();if(S.next){const n=S.next;schedule(n.fn,n.args,400);}return;}
  S=blankState('title');
  render();
}
window.claude?.hot?.snapshot?.(()=>NET.mode==='solo'?{S}:{});
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
