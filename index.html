<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>硝子牌麻雀</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: four-seat night table. Phone: opponents stacked above you. Desktop: 対面 on top, 上家 left, 下家 right, you at the bottom. Single deliberate dark look. */
:root{
  --table:#0E1922; --table-hi:#16293A; --line:rgba(205,167,94,.22); --panel:rgba(255,255,255,.025);
  --text:#ECE6D6; --muted:#93A3AF; --brass:#CDA75E; --brass-hi:#E6C27A;
  --blood:#7C1F29; --blood-dk:#4A1118;
  --ivory-dk:#C8BC9C; --ink:#1B2529; --t-red:#B32A31; --t-green:#1D7047; --t-blue:#244F8E;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
  --tw:clamp(20px, calc((min(100vw, 900px) - 64px) / 15.6), 46px);
  --ow:calc(var(--tw)*.8); --rw:calc(var(--tw)*.7); --mrw:calc(var(--tw)*.74);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0; background:radial-gradient(120% 80% at 50% 45%, var(--table-hi), var(--table) 70%) fixed; background-color:var(--table); color:var(--text); font-family:var(--f-body); font-size:14px; overflow-x:hidden}
#app{max-width:1100px; margin:0 auto; display:grid; gap:8px; grid-template-columns:minmax(0,1fr); grid-template-areas:"hdr" "o2" "o3" "o1" "ctr" "me"; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:10px; box-sizing:border-box}
@media (min-width:900px){
  #app{grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-areas:"hdr hdr" "o2 o2" "o3 o1" "ctr ctr" "me me"; gap:10px 18px}
  :root{--ow:min(calc(var(--tw)*.8), calc((min(100vw,1100px) - 90px) / 2 / 16.5)); --rw:min(calc(var(--tw)*.66), calc((min(100vw,1100px) - 90px) / 2 / 19))}
  #o2 .hand, #o2 .river{justify-content:center}
}
button{font-family:inherit; color:inherit}
:focus-visible{outline:2px solid var(--brass-hi); outline-offset:2px}

.bar{grid-area:hdr; display:flex; align-items:center; gap:8px 14px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:8px}
.brand{font-family:var(--f-display); font-weight:800; font-size:18px; letter-spacing:.12em; color:var(--brass)}
.chip{display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:12px}
.chip b{color:var(--text); font-family:var(--f-num); font-weight:500; font-variant-numeric:tabular-nums}
.chip .tile{--w:calc(var(--tw)*.58)}
.bar .spacer{flex:1}
.ghost{background:none; border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-size:12px; color:var(--muted); cursor:pointer}
.ghost:hover{color:var(--text); border-color:var(--brass)}
.ghost[aria-pressed="true"]{color:var(--table); background:var(--brass); border-color:var(--brass)}

.seat{display:flex; flex-direction:column; gap:5px; min-width:0}
.opp{background:var(--panel); border:1px solid rgba(205,167,94,.1); border-radius:10px; padding:6px 10px 8px}
.opp.turn, .me.turn{border-color:rgba(230,194,122,.55)}
#o1{grid-area:o1} #o2{grid-area:o2} #o3{grid-area:o3}
.who{display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-height:22px}
.who .name{font-family:var(--f-display); font-weight:800; font-size:14px; letter-spacing:.06em}
.who .pos{font-size:11px; color:var(--muted)}
.wind{font-family:var(--f-display); font-size:12px; border:1px solid var(--brass); color:var(--brass); border-radius:4px; padding:0 5px}
.wind.dealer{background:var(--brass); color:var(--table)}
.score{font-family:var(--f-num); font-variant-numeric:tabular-nums; font-size:14px}
.flag{font-size:11px; letter-spacing:.1em; padding:1px 8px; border-radius:999px; background:var(--blood); color:#FBE3DF}
.flag.furi{background:#3A4752; color:var(--text)}
.status{color:var(--muted); font-size:12px; margin-left:auto}
.status b{color:var(--brass-hi); font-weight:700}
.status i{font-style:normal; color:#E5847C}

.hand{display:flex; align-items:flex-end; gap:2px; flex-wrap:nowrap}
.opp .hand{--w:var(--ow); min-height:calc(var(--ow)*1.36 + 4px)}
.opp .hand .tile{--w:var(--ow)}
.me .hand{min-height:calc(var(--tw)*1.36 + 12px); padding-top:10px}
.hand .gap{width:calc(var(--tw)*.3); flex:none}
.melds{display:flex; gap:6px; margin-left:auto; align-items:flex-end; flex:none}
.meld{display:flex; gap:1px; align-items:flex-end}
.me .melds .tile{--w:calc(var(--tw)*.82)}
.river{display:flex; flex-wrap:wrap; gap:2px; align-content:flex-start}
.opp .river{min-height:calc(var(--rw)*1.36)}
.opp .river .tile{--w:var(--rw)}
.me .river{min-height:calc(var(--mrw)*1.36*2 + 4px)}
.me .river .tile{--w:var(--mrw)}
.me{grid-area:me}

.center{grid-area:ctr; display:flex; align-items:center; justify-content:center; min-height:34px; border-block:1px solid var(--line); padding-block:6px; text-align:center}
#msg{font-size:13px; text-wrap:balance}
#msg em{font-style:normal; color:var(--brass-hi); font-weight:700}

.actions{display:flex; gap:8px; flex-wrap:wrap; min-height:42px; align-items:center}
.btn{border:1px solid var(--brass); background:none; color:var(--brass-hi); border-radius:8px; padding:8px 18px; font-size:15px; font-weight:700; letter-spacing:.08em; cursor:pointer; font-family:var(--f-display); display:inline-flex; align-items:center; gap:6px}
.btn:hover{background:rgba(205,167,94,.12)}
.btn.primary{background:var(--brass); color:#1A1306}
.btn.primary:hover{background:var(--brass-hi)}
.btn.red{background:var(--blood); border-color:#B4434E; color:#FFE8E4}
.btn .tile{--w:calc(var(--tw)*.55)}
.hint{color:var(--muted); font-size:12px}

/* tiles */
.tile{--w:var(--tw); width:var(--w); height:calc(var(--w)*1.36); border-radius:calc(var(--w)*.14); position:relative; flex:none; padding:0; border:0; display:block; transition:transform .12s ease}
.tile svg{width:100%; height:100%; display:block; position:relative; z-index:1}
.tile.solid{background:linear-gradient(#FFFBF0,#ECE3CB); box-shadow:0 calc(var(--w)*.08) 0 var(--ivory-dk), 0 calc(var(--w)*.12) calc(var(--w)*.2) rgba(0,0,0,.5)}
.tile.glass{background:linear-gradient(160deg, rgba(232,250,255,.82), rgba(160,208,224,.52) 55%, rgba(206,238,248,.7)); box-shadow:inset 0 0 0 1px rgba(255,255,255,.75), inset 0 0 calc(var(--w)*.25) rgba(255,255,255,.4), 0 calc(var(--w)*.08) 0 rgba(110,170,192,.6), 0 calc(var(--w)*.12) calc(var(--w)*.22) rgba(0,0,0,.4)}
.tile.glass::after{content:""; position:absolute; inset:0; border-radius:inherit; background:linear-gradient(118deg, transparent 30%, rgba(255,255,255,.38) 36%, transparent 42%, transparent 64%, rgba(255,255,255,.18) 67%, transparent 70%); z-index:2; pointer-events:none}
.tile.back{background:linear-gradient(#93303A,var(--blood) 45%,var(--blood-dk)); box-shadow:inset 0 0 0 calc(var(--w)*.06) rgba(255,215,200,.14), 0 calc(var(--w)*.08) 0 #340A10, 0 calc(var(--w)*.12) calc(var(--w)*.2) rgba(0,0,0,.5)}
.tile.back::after{content:""; position:absolute; inset:22% 26%; border:1px solid rgba(255,215,200,.22); border-radius:50%}
.hand button.tile{cursor:pointer}
.hand button.tile:disabled{cursor:default}
.hand button.tile.sel{transform:translateY(-22%)}
@media (hover:hover){ .hand button.tile.can:hover{transform:translateY(-14%)} }
.tile.dim{filter:grayscale(.6) brightness(.5)}
.tile.rec::before{content:""; position:absolute; top:calc(var(--w)*-.3); left:50%; width:5px; height:5px; margin-left:-2.5px; border-radius:50%; background:var(--brass-hi); z-index:3}
.tile.last{outline:2px solid var(--brass-hi); outline-offset:1px}
.tile.side{transform:rotate(-90deg); margin-inline:calc(var(--w)*.18)}
.tile.called{opacity:.3}
.tile.win{outline:2px solid #E5534B; outline-offset:2px}
.tm{font-family:var(--f-display); font-weight:800; fill:var(--ink)}
.tr{font-family:var(--f-display); font-weight:800; fill:var(--t-red)}
.th{font-family:var(--f-display); font-weight:800}

/* overlay */
.overlay{position:fixed; inset:0; background:rgba(5,10,14,.72); display:flex; align-items:center; justify-content:center; z-index:20; padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px)); box-sizing:border-box}
.panel{background:linear-gradient(#18293A,#101D28); border:1px solid var(--line); border-radius:14px; width:min(640px,100%); max-height:100%; overflow:auto; padding:22px; box-sizing:border-box; display:flex; flex-direction:column; gap:14px; box-shadow:0 20px 60px rgba(0,0,0,.6)}
.panel h2{font-family:var(--f-display); font-weight:800; font-size:30px; letter-spacing:.14em; margin:0; color:var(--brass); text-wrap:balance}
.panel h2 small{font-size:14px; color:var(--muted); letter-spacing:.04em; margin-left:10px}
.panel p{margin:0; line-height:1.75; max-width:62ch}
.panel .lead{color:var(--muted)}
.rowtiles{display:flex; flex-wrap:wrap; gap:2px; align-items:flex-end}
.rowtiles .tile{--w:clamp(17px, 5.6vw, 32px)}
.rowtiles .gap{width:10px}
.yaku{display:grid; grid-template-columns:1fr auto; gap:4px 18px; font-size:14px}
.yaku span:nth-child(even){font-family:var(--f-num); color:var(--brass-hi); text-align:right}
.total{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; border-top:1px solid var(--line); padding-top:10px}
.total .big{font-family:var(--f-num); font-size:26px; color:var(--brass-hi); font-variant-numeric:tabular-nums}
.scores{display:grid; grid-template-columns:auto auto 1fr auto; gap:4px 14px; font-family:var(--f-num); font-variant-numeric:tabular-nums; align-items:baseline}
.scores .nm{font-family:var(--f-body)}
.scores .up{color:#7FC79A} .scores .down{color:#E5847C}
.rules{display:grid; gap:10px}
.rules h3{font-family:var(--f-display); font-size:16px; margin:6px 0 0; color:var(--brass)}
.rules ul{margin:0; padding-left:1.2em; line-height:1.75}
.legend{display:flex; gap:16px; flex-wrap:wrap; align-items:center; color:var(--muted); font-size:12px}
.legend span{display:inline-flex; gap:6px; align-items:center}
.legend .tile{--w:22px}
@media (max-width:420px){ .panel{padding:16px} .panel h2{font-size:24px} .btn{padding:8px 13px} }
@media (prefers-reduced-motion:reduce){ .tile{transition:none} }
</style>

<div id="app">
  <header class="bar">
    <div class="brand">硝子牌麻雀</div>
    <span class="chip"><b id="roundLabel">東1局</b><span id="honbaLabel"></span></span>
    <span class="chip">ドラ表示 <span id="doraInd"></span></span>
    <span class="chip">残り <b id="wallCount">0</b></span>
    <span class="chip">供託 <b id="potLabel">0</b></span>
    <span class="spacer"></span>
    <button class="ghost" id="viewBtn" aria-pressed="false" title="他家から見えている自分の手牌">他家視点</button>
    <button class="ghost" id="assistBtn" aria-pressed="true">アシスト</button>
    <button class="ghost" id="helpBtn">ルール</button>
  </header>

  <section class="seat opp" id="o2"></section>
  <section class="seat opp" id="o3"></section>
  <section class="seat opp" id="o1"></section>

  <div class="center"><div id="msg"></div></div>

  <section class="seat me" id="me">
    <div class="river" id="myRiver"></div>
    <div class="hand" id="myHand"></div>
    <div class="who"><span class="name">あなた</span><span class="wind" id="myWind">東</span><span class="score" id="myScore">25000</span><span class="flag" id="myRiichi" hidden>リーチ</span><span class="flag furi" id="myFuri" hidden>フリテン</span><span class="status" id="myStatus"></span></div>
    <div class="actions" id="actions"></div>
  </section>
</div>

<div class="overlay" id="overlay" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>

<script>
/*LOGIC-START*/
const KNUM=['一','二','三','四','五','六','七','八','九'];
const HONOR=['東','南','西','北','白','發','中'];
const GREEN=[19,20,21,23,25,32];
const isHonor=k=>k>=27;
const isTerm=k=>k<27&&(k%9===0||k%9===8);
const isYao=k=>isHonor(k)||isTerm(k);
const suitOf=k=>k<27?Math.floor(k/9):3;
function tileName(k){return k<27?KNUM[k%9]+['萬','筒','索'][suitOf(k)]:HONOR[k-27];}
function doraFrom(i){if(i<27)return suitOf(i)*9+(i%9+1)%9; if(i<31)return 27+(i-27+1)%4; return 31+(i-31+1)%3;}
function makeTiles(){const a=[];for(let k=0;k<34;k++)for(let c=0;c<4;c++)a.push({id:k*4+c,k,g:c<3});return a;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function counts(tiles){const c=new Array(34).fill(0);for(const t of tiles)c[t.k]++;return c;}

function shantenNormal(c,nm=0){
  let best=8; const cc=c.slice();
  function rec(i,m,t,p){
    while(i<34&&cc[i]===0)i++;
    if(i>=34){const s=8-2*m-Math.min(t,4-m)-p; if(s<best)best=s; return;}
    if(cc[i]>=3){cc[i]-=3;rec(i,m+1,t,p);cc[i]+=3;}
    if(i<27&&i%9<=6&&cc[i+1]&&cc[i+2]){cc[i]--;cc[i+1]--;cc[i+2]--;rec(i,m+1,t,p);cc[i]++;cc[i+1]++;cc[i+2]++;}
    if(cc[i]>=2){cc[i]-=2;if(!p)rec(i,m,t,1);if(m+t<4)rec(i,m,t+1,p);cc[i]+=2;}
    if(m+t<4){
      if(i<27&&i%9<=7&&cc[i+1]){cc[i]--;cc[i+1]--;rec(i,m,t+1,p);cc[i]++;cc[i+1]++;}
      if(i<27&&i%9<=6&&cc[i+2]){cc[i]--;cc[i+2]--;rec(i,m,t+1,p);cc[i]++;cc[i+2]++;}
    }
    const n=cc[i]; cc[i]=0; rec(i+1,m,t,p); cc[i]=n;
  }
  rec(0,nm,0,0); return best;
}
function shantenChiitoi(c){let p=0,k=0;for(const v of c){if(v>=2)p++;if(v>=1)k++;}return 6-p+Math.max(0,7-k);}
function shantenKokushi(c){let k=0,pair=0;for(let i=0;i<34;i++)if(isYao(i)&&c[i]){k++;if(c[i]>=2)pair=1;}return 13-k-pair;}
function shanten(c,nm=0){const n=shantenNormal(c,nm);return nm?n:Math.min(n,shantenChiitoi(c),shantenKokushi(c));}
function waitsOf(c,nm=0){const w=[];for(let k=0;k<34;k++){if(c[k]>=4)continue;c[k]++;if(shanten(c,nm)===-1)w.push(k);c[k]--;}return w;}

function decompose(c){
  const res=[],cc=c.slice();
  for(let p=0;p<34;p++){
    if(cc[p]<2)continue; cc[p]-=2; const melds=[];
    (function rec(i){
      while(i<34&&cc[i]===0)i++;
      if(i>=34){res.push({pair:p,melds:melds.slice()});return;}
      if(cc[i]>=3){cc[i]-=3;melds.push({t:'pon',k:i});rec(i);melds.pop();cc[i]+=3;}
      if(i<27&&i%9<=6&&cc[i+1]&&cc[i+2]){cc[i]--;cc[i+1]--;cc[i+2]--;melds.push({t:'chi',k:i});rec(i);melds.pop();cc[i]++;cc[i+1]++;cc[i+2]++;}
    })(0);
    cc[p]+=2;
  }
  return res;
}
function isKokushi(c){let s=0;for(let i=0;i<34;i++){if(isYao(i)){if(!c[i])return false;s+=c[i];}else if(c[i])return false;}return s===14;}
function isChiitoi(c){let n=0;for(const v of c){if(v===2)n++;else if(v)return false;}return n===7;}
function limitOf(han,fu){
  if(han>=13)return[8000,'数え役満']; if(han>=11)return[6000,'三倍満']; if(han>=8)return[4000,'倍満']; if(han>=6)return[3000,'跳満'];
  const b=fu*Math.pow(2,han+2); if(han>=5||b>=2000)return[2000,'満貫']; return[b,''];
}
/* c: concealed counts incl. win tile. fixed: called/kan melds [{t:'pon'|'chi',k,open,kan}].
   ctx: tsumo, riichi, ippatsu, last, rinshan, chankan, seat, round, dora[], ura[] */
function evaluate(c,win,ctx,fixed=[]){
  const all=c.slice();
  for(const m of fixed){if(m.t==='chi'){all[m.k]++;all[m.k+1]++;all[m.k+2]++;}else all[m.k]+=m.kan?4:3;}
  const kinds=[];for(let k=0;k<34;k++)if(all[k])kinds.push(k);
  const menzen=!fixed.some(m=>m.open);
  const hasHonor=kinds.some(isHonor);
  const suits=new Set(kinds.filter(k=>k<27).map(suitOf));
  const common=[];
  if(ctx.riichi)common.push(['立直',1]);
  if(ctx.ippatsu)common.push(['一発',1]);
  if(ctx.tsumo&&menzen)common.push(['門前清自摸和',1]);
  if(ctx.last)common.push([ctx.tsumo?'海底摸月':'河底撈魚',1]);
  if(ctx.rinshan)common.push(['嶺上開花',1]);
  if(ctx.chankan)common.push(['槍槓',1]);
  const shape={menzen,noYao:kinds.every(k=>!isYao(k)),allYao:kinds.every(isYao),hasHonor,
    flush:suits.size===1?(hasHonor?['混一色',menzen?3:2]:['清一色',menzen?6:5]):null,common,commonYm:[]};
  if(kinds.every(isHonor))shape.commonYm.push(['字一色',1]);
  if(kinds.every(k=>GREEN.includes(k)))shape.commonYm.push(['緑一色',1]);
  if(kinds.every(isTerm))shape.commonYm.push(['清老頭',1]);
  if(fixed.filter(m=>m.kan).length===4)shape.commonYm.push(['四槓子',1]);
  if(!fixed.length&&suits.size===1&&!hasHonor){const s=[...suits][0]*9;if([3,1,1,1,1,1,1,1,3].every((v,i)=>c[s+i]>=v))shape.commonYm.push(['九蓮宝燈',1]);}
  const forms=[];
  if(!fixed.length&&isKokushi(c))forms.push({ym:[['国士無双',1]],yaku:[],fu:0});
  if(!fixed.length&&isChiitoi(c)){
    const y=[...common,['七対子',2]];
    if(shape.noYao)y.push(['断幺九',1]); if(shape.allYao)y.push(['混老頭',2]); if(shape.flush)y.push(shape.flush);
    forms.push({ym:shape.commonYm.slice(),yaku:y,fu:25});
  }
  for(const d of decompose(c)){
    const pls=[];
    if(d.pair===win)pls.push({wait:'tanki',meld:-1});
    d.melds.forEach((m,i)=>{
      if(m.t==='pon'&&m.k===win)pls.push({wait:'shanpon',meld:i});
      if(m.t==='chi'&&win>=m.k&&win<=m.k+2){
        const pos=win-m.k,n=m.k%9;
        pls.push({wait:pos===1?'kanchan':(pos===0&&n===6)||(pos===2&&n===0)?'penchan':'ryanmen',meld:i});
      }
    });
    for(const pl of pls)forms.push(normalForm(d,pl,ctx,shape,fixed));
  }
  let best=null;
  for(const f of forms){
    let r;
    if(f.ym.length){
      const n=f.ym.reduce((a,y)=>a+y[1],0);
      r={yaku:f.ym.map(y=>[y[0],'役満']),han:13*n,fu:f.fu,base:8000*n,label:n>1?n+'倍役満':'役満',yakuman:true};
    }else{
      const yh=f.yaku.reduce((a,y)=>a+y[1],0); if(!yh)continue;
      const yaku=f.yaku.slice();
      let dora=0;for(const d of ctx.dora)dora+=all[d];
      if(dora)yaku.push(['ドラ',dora]);
      let ura=0;if(ctx.riichi)for(const d of ctx.ura)ura+=all[d];
      if(ura)yaku.push(['裏ドラ',ura]);
      const han=yh+dora+ura; const [base,label]=limitOf(han,f.fu);
      r={yaku,han,fu:f.fu,base,label,yakuman:false};
    }
    if(!best||r.base>best.base||(r.base===best.base&&r.han>best.han))best=r;
  }
  return best;
}
function normalForm(d,pl,ctx,shape,fixed){

  if(pinfu)yaku.push(['平和',1]);

    const k=m.k;

  }
  for(let n=0;n<7;n++)if(chis.includes(n)&&chis.includes(n+9)&&chis.includes(n+18)){yaku.push(['三色同順',menzen?2:1]);break;}
  for(let s=0;s<3;s++)if([0,3,6].every(o=>chis.includes(s*9+o))){yaku.push(['一気通貫',menzen?2:1]);break;}

  if(allGroupsYao&&chis.length)yaku.push(shape.hasHonor?['混全帯幺九',menzen?2:1]:['純全帯幺九',menzen?3:2]);
  if(pons.length===4)yaku.push(['対々和',2]);
  if(anko===3)yaku.push(['三暗刻',2]);
  if(kans===3)yaku.push(['三槓子',2]);
  if(shape.allYao&&!chis.length)yaku.push(['混老頭',2]);
  if(dragonP===2&&d.pair>=31)yaku.push(['小三元',2]);

const HOVER=window.matchMedia('(hover: hover) and (pointer: fine)').matches;

const seatWind=p=>27+(p-S.dealer+4)%4;

function newGame(){S={scores:[25000,25000,25000,25000],dealer:0,handNo:1,honba:0,pot:0,phase:'play'};startHand();}

function handCounts(p){return counts(S.hands[p]);}

}
function canRon(p,tile,extra={}){

function riichiOptions(p){

}

  const c=handCounts(p),out=[];

  S.melds[p].forEach((m,i)=>{if(m.type==='pon'&&c[m.k])out.push({kind:'kakan',k:m.k,mi:i});});

}
function callOptions(p,from,tile){
  const o={pon:false,kan:false,chi:[]};
  if(S.riichi[p]||S.wall.length===0)return o;
  const c=handCounts(p),k=tile.k;
  if(c[k]>=2)o.pon=true;
  if(c[k]>=3&&S.kans<4)o.kan=true;

const hasCall=o=>o.pon||o.kan||o.chi.length;

function drawTile(p,rinshan){

  const t=rinshan?S.dead[S.kans-1]:S.wall.shift();
  S.rinshan=!!rinshan;
  S.hands[p].push(t); S.drawn[p]=t.id; S.turn=p; S.awaiting=null; S.sel=null; S.kuikae[p]=[];
  if(p===0){
    const tw=canTsumo(0);
    if(S.riichi[0]){
      if(tw){S.awaiting={type:'self',tsumo:tw,riichi:[],kans:[],locked:true};S.msg='<em>ツモ</em>和了できます';render();return;}
      S.msg='リーチ中。ツモ切りします'; render(); schedule('discard',[0,t.id,false],600); return;
    }
    S.awaiting={type:'self',tsumo:tw,riichi:riichiOptions(0),kans:selfKanOptions(0)};
    S.msg=tw?'<em>ツモ</em>和了できます':(rinshan?'嶺上牌を引きました。':'')+(HOVER?'捨てる牌をクリック':'牌をタップで選択、もう一度タップで捨てる');

}
function discard(p,id,decl){

  if(S.riichi[p]&&!decl)S.ippatsu[p]=false;
  if(decl){S.riichi[p]=true;S.ippatsu[p]=true;S.scores[p]-=1000;S.pot++;S.riichiIdx[p]=S.discards[p].length;}
  S.discards[p].push(t); S.drawn[p]=null; S.lastDiscard=t.id; S.rinshan=false; S.kuikae[p]=[];
  if(!S.riichi[p])S.furitenTemp[p]=false;
  sortHand(p); S.awaiting=null; S.sel=null; S.riichiMode=false;

function claimTile(){const cl=S.claim;return S.discards[cl.from].concat(S.melds[cl.from].flatMap(m=>m.tiles)).find(t=>t.id===cl.tid);}
function claimStep(){
  const cl=S.claim,from=cl.from,tile=claimTile();
  const order=[1,2,3].map(i=>(from+i)%4);
  if(cl.phase==='ron'){
    for(;cl.i<3;cl.i++){
      const o=order[cl.i];
      const r=canRon(o,tile,{chankan:cl.kind==='chankan'});
      if(!r){if(waitsP(o).includes(tile.k))S.furitenTemp[o]=true;continue;}
      if(o===0){S.awaiting={type:'ron',res:r};S.msg=`${tileName(tile.k)} で<em>ロン</em>できます`;render();return;}
      return win(o,r,false,from);

    if(cl.kind==='chankan'){S.claim=null;return afterKan(from);}
    cl.phase='call';
  }
  if(S.wall.length===0){render();return schedule('ryuukyoku',[],600);}
  // CPU pon / kan
  for(const o of order){
    if(o===0)continue;
    const opt=callOptions(o,from,tile);
    if(opt.pon&&cpuWantsPon(o,tile))return doCall(o,'pon',null);
  }
  if(!cl.offered){
    const opt=callOptions(0,from,tile);

  }

/* ---------- CPU ---------- */
function visibleTo(p){
  const v=new Array(34).fill(0);
  for(const t of S.hands[p])v[t.k]++;
  for(const d of S.discards)for(const t of d)if(!t.called)v[t.k]++;
  for(const ms of S.melds)for(const m of ms)for(const t of m.tiles)v[t.k]++;

function dangerVs(r,k,vis){
  if(S.discards[r].some(d=>d.k===k))return 0;
  const pg=new Array(34).fill(0); for(const t of S.hands[r])if(t.g)pg[t.k]++;
  if(vis[k]>=4)return 0;
  let d;
  if(k>=27){d=vis[k]>=3?0.2:vis[k]===2?1.2:2.5; if(pg[k]>=2)d+=7; else if(pg[k])d+=1.5;}
  else{
    const n=k%9; d=(n===0||n===8)?3:(n===1||n===7)?4:5;
    const disc=j=>S.discards[r].some(t=>t.k===j);
    const lo=n<3||disc(k-3),hi=n>5||disc(k+3);
    if(lo&&hi)d*=0.4; else if(lo||hi)d*=0.75;
    const g=j=>(j>=0&&j<27&&suitOf(j)===suitOf(k))?pg[j]:0;
    if(g(k-1)&&g(k-2))d+=6; if(g(k+1)&&g(k+2))d+=6; if(g(k-1)&&g(k+1))d+=6;
    if(pg[k]>=2)d+=6; else if(pg[k])d+=1;
  }
  return d;
}
const isYakuhaiFor=(p,k)=>k>=31||k===seatWind(p)||k===27;
function yakuPlan(p,c,melds){
  // returns which yaku the open hand is aiming for, or null
  if(melds.some(m=>m.t==='pon'&&isYakuhaiFor(p,m.k)))return{type:'yakuhai'};
  for(let k=27;k<34;k++)if(isYakuhaiFor(p,k)&&c[k]>=3)return{type:'yakuhai'};
  const meldK=melds.flatMap(m=>m.t==='chi'?[m.k,m.k+1,m.k+2]:[m.k]);
  let yaoC=0;for(let k=0;k<34;k++)if(isYao(k))yaoC+=c[k];
  if(meldK.every(k=>!isYao(k))&&yaoC<=2)return{type:'tanyao'};
  const bySuit=[0,0,0];for(let k=0;k<27;k++)bySuit[suitOf(k)]+=c[k];
  meldK.forEach(k=>{if(k<27)bySuit[suitOf(k)]+=3;});
  const s=bySuit.indexOf(Math.max(...bySuit));
  const off=bySuit.reduce((a,v,i)=>i===s?a:a+v,0);
  if(meldK.every(k=>k>=27||suitOf(k)===s)&&off<=2)return{type:'honitsu',s};
  return null;
}
const offPlan=(plan,k)=>plan&&((plan.type==='tanyao'&&isYao(k))||(plan.type==='honitsu'&&k<27&&suitOf(k)!==plan.s));
function bestAfterDiscard(c,n){let b=9;for(let k=0;k<34;k++){if(!c[k])continue;c[k]--;b=Math.min(b,shanten(c,n));c[k]++;}return b;}
function cpuWantsCallShape(p,c,newMeld){
  const n=nm(p),sh0=shanten(c,n);
  const melds=fixedOf(p).concat([newMeld]);
  const cc=c.slice();
  if(newMeld.t==='chi'){for(const k of newMeld.used)cc[k]--;}else cc[newMeld.k]-=2;
  const sh1=bestAfterDiscard(cc,n+1);
  const yh=newMeld.t==='pon'&&isYakuhaiFor(p,newMeld.k);
  if(yh&&sh1<=sh0)return true;
  if(sh1>=sh0)return false;
  return !!yakuPlan(p,cc,melds);
}
function cpuWantsPon(p,tile){if(S.riichi.some((r,i)=>r&&i!==p)&&shanten(handCounts(p),nm(p))>1)return false;return cpuWantsCallShape(p,handCounts(p),{t:'pon',k:tile.k,open:true});}
function cpuWantsChi(p,tile,pat){if(S.riichi.some((r,i)=>r&&i!==p))return false;return cpuWantsCallShape(p,handCounts(p),{t:'chi',k:Math.min(tile.k,pat[0]),open:true,used:pat});}
function tileValue(p,k){
  let v=isHonor(k)?(isYakuhaiFor(p,k)?1:0):isTerm(k)?1:(k%9===1||k%9===7)?2:3;
  if(S.doraInd.some(t=>doraFrom(t.k)===k))v+=4;
  return v;
}
function cpuChoose(p){
  const h=S.hands[p],c=counts(h),vis=visibleTo(p),n=nm(p);
  const open=S.melds[p].some(m=>m.type!=='ankan');
  const plan=open?yakuPlan(p,c,fixedOf(p)):null;
  const threats=[0,1,2,3].filter(q=>q!==p&&S.riichi[q]);
  let kinds=[...new Set(h.map(t=>t.k))];
  const kk=kinds.filter(k=>!S.kuikae[p].includes(k)); if(kk.length)kinds=kk;
  const ev=kinds.map(k=>{
    c[k]--; const sh=shanten(c,n); let uk=0;
    if(sh<=3)for(let j=0;j<34;j++){if(c[j]>=4)continue;c[j]++;if(shanten(c,n)<sh)uk+=Math.max(0,4-vis[j]);c[j]--;}
    c[k]++;
    const dg=threats.length?Math.max(...threats.map(r=>dangerVs(r,k,vis))):0;
    return{k,sh,uk,dg,val:tileValue(p,k),off:offPlan(plan,k)?1:0};
  });
  const minSh=Math.min(...ev.map(e=>e.sh));
  let pick;
  if(threats.length){
    const push=minSh===0||(minSh===1&&S.wall.length>30);
    if(push){
      pick=ev.filter(e=>e.sh===minSh).sort((a,b)=>a.dg-b.dg||b.uk-a.uk)[0];
      if(pick.dg>8){const safe=ev.filter(e=>e.dg<2).sort((a,b)=>a.sh-b.sh||b.uk-a.uk)[0];if(safe&&minSh>0)pick=safe;}
    }else pick=ev.slice().sort((a,b)=>a.dg-b.dg||a.sh-b.sh||b.uk-a.uk)[0];
  }else pick=ev.slice().sort((a,b)=>b.off-a.off||a.sh-b.sh||b.uk-a.uk||a.val-b.val)[0];
  const same=h.filter(t=>t.k===pick.k);
  const tile=same.find(t=>t.g)||same[0];
  return{id:tile.id,riichi:riichiOptions(p).includes(tile.id)};
}
function cpuAct(p){
  const tw=canTsumo(p); if(tw)return win(p,tw,true,p);
  if(S.riichi[p])return discard(p,S.drawn[p],false);
  const ko=selfKanOptions(p);
  for(const o of ko){
    const c=handCounts(p),before=shanten(c,nm(p));
    if(o.kind==='ankan'){c[o.k]-=4;if(bestAfterDiscard(c,nm(p)+1)<=before)return doSelfKan(p,o);}
    else return doSelfKan(p,o);
  }
  cpuDiscard(p);
}
function cpuDiscard(p){const ch=cpuChoose(p);discard(p,ch.id,ch.riichi);}
const FN={drawTile,discard,cpuAct,cpuDiscard,win,ryuukyoku,claimStep,afterKan};

/* ---------- player input ---------- */
function allowedDiscard(id){
  const aw=S.awaiting; if(!aw||aw.type!=='self'||aw.locked||S.next)return false;
  if(S.riichiMode)return aw.riichi.includes(id);
  const t=S.hands[0].find(x=>x.id===id),kz=S.kuikae[0];
  if(kz.length&&kz.includes(t.k)&&S.hands[0].some(x=>!kz.includes(x.k)))return false;
  return true;
}
function onTile(id){
  if(!allowedDiscard(id))return;
  if(HOVER||S.sel===id)discard(0,id,S.riichiMode);
  else{S.sel=id;render();}
}
function onAction(a,arg){
  const aw=S.awaiting; if(!aw||S.next)return;
  if(a==='tsumo')return win(0,aw.tsumo,true,0);
  if(a==='riichi'){S.riichiMode=true;S.sel=null;S.msg='リーチ宣言牌を選んでください';render();return;}
  if(a==='cancel'){S.riichiMode=false;S.msg='捨てる牌を選んでください';render();return;}
  if(a==='kan')return doSelfKan(0,aw.kans[+arg]);
  if(a==='skipTsumo'){S.awaiting=null;S.furitenTemp[0]=true;discard(0,S.drawn[0],false);return;}
  if(a==='ron')return win(0,aw.res,false,S.claim.from);
  if(a==='skipRon')return passRon();
  if(a==='pon')return doCall(0,'pon',null);
  if(a==='minkan')return doCall(0,'minkan',null);
  if(a==='chi')return doCall(0,'chi',aw.opt.chi[+arg]);
  if(a==='skipCall'){S.awaiting=null;claimStep();}
}

const $=id=>document.getElementById(id);
function tileEl(t,cls=''){return `<div class="tile ${t.g?'glass':'solid'} ${cls}" title="${tileName(t.k)}${t.g?'（透明）':'（不透明）'}">${faceSVG(t.k)}</div>`;}
const backEl=(cls='')=>`<div class="tile back ${cls}"></div>`;
function riverHTML(p){
  return S.discards[p].map((t,i)=>tileEl(t,[i===S.riichiIdx[p]?'side':'',t.called?'called':'',t.id===S.lastDiscard&&i===S.discards[p].length-1&&!t.called?'last':''].join(' '))).join('');
}
function meldsHTML(p){
  return S.melds[p].map(m=>`<div class="meld">${m.tiles.map(t=>tileEl(t,t.id===m.calledId?'side':'')).join('')}</div>`).join('');
}
function concealedHTML(p){
  const h=S.hands[p],drawn=S.drawn[p];
  const main=h.filter(t=>t.id!==drawn),d=h.find(t=>t.id===drawn);
  const one=t=>t.g?tileEl(t):backEl();

}
function oppHTML(p){

  <div class="hand">${concealedHTML(p)}<span class="melds">${meldsHTML(p)}</span></div><div class="river">${riverHTML(p)}</div>`;
}
function myHandHTML(){
  const h=S.hands[0],aw=S.awaiting,canDis=aw&&aw.type==='self'&&!aw.locked&&!S.next;
  let rec=[];
  if(UI.assist&&canDis&&h.length%3===2&&!S.riichiMode){
    const c=counts(h),n=nm(0);let best=99;const sh={};
    for(const t of h){if(sh[t.k]!==undefined||!allowedDiscard(t.id))continue;c[t.k]--;sh[t.k]=shanten(c,n);c[t.k]++;best=Math.min(best,sh[t.k]);}
    rec=Object.keys(sh).filter(k=>sh[k]===best).map(Number);
  }
  const drawn=S.drawn[0],main=h.filter(t=>t.id!==drawn),d=h.find(t=>t.id===drawn);
  const one=t=>{
    const ok=canDis&&allowedDiscard(t.id);
    const cls=[t.g?'glass':'solid',ok?'can':'',S.sel===t.id?'sel':'',canDis&&!ok?'dim':'',rec.includes(t.k)?'rec':''].join(' ');
    if(UI.view&&!t.g)return `<button class="tile back ${cls}" data-id="${t.id}" ${ok?'':'disabled'} aria-label="${tileName(t.k)}"></button>`;
    return `<button class="tile ${cls}" data-id="${t.id}" ${ok?'':'disabled'} aria-label="${tileName(t.k)}${t.g?' 透明':' 不透明'}">${faceSVG(t.k)}</button>`;
  };
  return main.map(one).join('')+(d?'<span class="gap"></span>'+one(d):'')+`<span class="melds">${meldsHTML(0)}</span>`;
}
function statusHTML(){
  const h=S.hands[0]; if(h.length%3!==1)return '';

  if(sh>0)return `${sh}向聴`;

  const left=w.reduce((a,k)=>a+Math.max(0,4-vis[k]),0);
  const anyYaku=S.riichi[0]||w.some(k=>{const cc=c.slice();cc[k]++;return evaluate(cc,k,ctxFor(0,false),fixedOf(0));});
